---
- ansible.builtin.debug:
    msg: Start eos_ospfv3 deleted integration tests ansible_connection={{
      ansible_connection }}

- ansible.builtin.include_tasks: _populate.yaml

- block:
    - name: Delete given ospfv3 configuration
      become: true
      register: result
      arista.eos.eos_ospfv3: &deleted
        config:
          processes:
            - vrf: "vrf01"
        state: deleted

    - become: true
      arista.eos.eos_facts:
        gather_network_resources: ospfv3

    - ansible.builtin.assert:
        that:
          - result.commands|length == 1
          - result.changed == true
          - "'no router ospfv3 vrf vrf01' in result.commands"
          - ansible_facts.network_resources.ospfv3 == result.after
          - >-
            (result.after.processes | to_json |
            regex_replace(ospfv3_secret_json_pattern,
            ospfv3_secret_json_replacement) | from_json) |
            symmetric_difference((deleted.after.processes | to_json |
            regex_replace(ospfv3_secret_json_pattern,
            ospfv3_secret_json_replacement) | from_json)) == []
          - >-
            (result.before.processes | to_json |
            regex_replace(ospfv3_secret_json_pattern,
            ospfv3_secret_json_replacement) | from_json) |
            symmetric_difference((replaced.before.processes | to_json |
            regex_replace(ospfv3_secret_json_pattern,
            ospfv3_secret_json_replacement) | from_json)) == []

    - name: Idempotency check
      become: true
      register: result
      arista.eos.eos_ospfv3: *deleted

    - ansible.builtin.assert:
        that:
          - result.commands|length == 0
          - result.changed == false
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
