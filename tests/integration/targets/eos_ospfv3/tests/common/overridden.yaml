---
- ansible.builtin.debug:
    msg: Start eos_ospfv3 overridden integration tests ansible_connection={{
      ansible_connection }}

- ansible.builtin.include_tasks: _populate.yaml

- block:
    - name: override given ospfv3 configuration
      become: true
      register: result
      arista.eos.eos_ospfv3: &overridden
        state: overridden
        config:
          processes:
            - address_family:
                - afi: "ipv6"
                  areas:
                    - area_id: "0.0.0.1"
                      stub:
                        set: true
                  distance: 200
                  redistribute:
                    - routes: "static"
                - afi: "ipv4"
                  areas:
                    - area_id: "0.0.0.3"
                      ranges:
                        - address: 60.1.0.0/16
                          cost: 30
              vrf: "vrf02"

    - ansible.builtin.assert:
        that:
          - result.commands|length == 15
          - result.changed == true
          - >-
            (result.commands | to_json |
            regex_replace(ospfv3_secret_command_json_pattern,
            ospfv3_secret_command_json_replacement) | from_json) |
            symmetric_difference((overridden.commands | to_json |
            regex_replace(ospfv3_secret_command_json_pattern,
            ospfv3_secret_command_json_replacement) | from_json)) == []
          - >-
            (result.after.processes | to_json |
            regex_replace(ospfv3_secret_json_pattern,
            ospfv3_secret_json_replacement) | from_json) |
            symmetric_difference((overridden.after.processes | to_json |
            regex_replace(ospfv3_secret_json_pattern,
            ospfv3_secret_json_replacement) | from_json)) == []
          - >-
            (result.before.processes | to_json |
            regex_replace(ospfv3_secret_json_pattern,
            ospfv3_secret_json_replacement) | from_json) |
            symmetric_difference((populate.before.processes | to_json |
            regex_replace(ospfv3_secret_json_pattern,
            ospfv3_secret_json_replacement) | from_json)) == []

    - name: Idempotency check
      become: true
      register: result
      arista.eos.eos_ospfv3: *overridden

    - ansible.builtin.assert:
        that:
          - result.commands|length == 0
          - result.changed == false
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
