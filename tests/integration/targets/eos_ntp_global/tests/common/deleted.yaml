---
- ansible.builtin.debug:
    msg: Start eos_ntp_global deleted integration tests ansible_connection={{
      ansible_connection }}

- ansible.builtin.include_tasks: _populate.yaml

- block:
    - name: Delete given ntp_global configuration
      become: true
      register: result
      arista.eos.eos_ntp_global: &deleted
        state: deleted

    - become: true
      arista.eos.eos_facts:
        gather_network_resources: ntp_global

    - ansible.builtin.assert:
        that:
          - result.commands|length == 11
          - result.changed == true
          - ansible_facts.network_resources.ntp_global == result.after
          - result.after == {}
          - >-
            (result.before | to_json | regex_replace(ntp_key_json_pattern,
            ntp_key_json_replacement) | from_json) ==
            (replaced.before | to_json | regex_replace(ntp_key_json_pattern,
            ntp_key_json_replacement) | from_json)
          - >-
            (result.commands | to_json |
            regex_replace(ntp_key_command_json_pattern,
            ntp_key_command_json_replacement) | from_json) |
            symmetric_difference((deleted.commands | to_json |
            regex_replace(ntp_key_command_json_pattern,
            ntp_key_command_json_replacement) | from_json)) == []

    - name: Idempotency check
      become: true
      register: result
      arista.eos.eos_ntp_global: *deleted

    - ansible.builtin.assert:
        that:
          - result.commands|length == 0
          - result.changed == false
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
