---
- ansible.builtin.debug:
    msg: Start eos_ntp_global replaced integration tests ansible_connection={{
      ansible_connection }}

- ansible.builtin.include_tasks: _populate.yaml

- block:
    - name: replace given ntp_global configuration
      become: true
      register: result
      arista.eos.eos_ntp_global: &replaced
        state: replaced
        config:
          qos_dscp: 15
          authentication_keys:
            - id: 25
              algorithm: "md5"
              encryption: 7
              key: "123456"
          servers:
            - server: "110.21.1.1"
              burst: true
              prefer: true
              minpoll: 13
          serve:
            access_lists:
              - afi: "ip"
                acls:
                  - acl_name: "acl03"
                    direction: "in"

    - ansible.builtin.assert:
        that:
          - result.commands|length == 14
          - result.changed == true
          - >-
            (result.commands | to_json |
            regex_replace(ntp_key_command_json_pattern,
            ntp_key_command_json_replacement) | from_json) |
            symmetric_difference((replaced.commands | to_json |
            regex_replace(ntp_key_command_json_pattern,
            ntp_key_command_json_replacement) | from_json)) == []
          - >-
            (result.after | to_json | regex_replace(ntp_key_json_pattern,
            ntp_key_json_replacement) | from_json) ==
            (replaced.after | to_json | regex_replace(ntp_key_json_pattern,
            ntp_key_json_replacement) | from_json)
          - >-
            (result.before | to_json | regex_replace(ntp_key_json_pattern,
            ntp_key_json_replacement) | from_json) ==
            (replaced.before | to_json | regex_replace(ntp_key_json_pattern,
            ntp_key_json_replacement) | from_json)

    - name: Idempotency check
      become: true
      register: result
      arista.eos.eos_ntp_global: *replaced

    - ansible.builtin.assert:
        that:
          - result.commands|length == 0
          - result.changed == false
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
