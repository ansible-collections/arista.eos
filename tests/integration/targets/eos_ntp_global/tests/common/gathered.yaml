---
- ansible.builtin.debug:
    msg:
      START eos_ntp_global gathered integration tests on connection={{ ansible_connection
      }}

- ansible.builtin.include_tasks: _populate.yaml

- block:
    - name: Gathered the provided configuration with the exisiting running configuration
      become: true
      register: result
      arista.eos.eos_ntp_global:
        config:
        state: gathered

    - name: Assert
      ansible.builtin.assert:
        that:
          - >-
            (replaced.before | to_json | regex_replace(ntp_key_json_pattern,
            ntp_key_json_replacement) | from_json) ==
            (result.gathered | to_json | regex_replace(ntp_key_json_pattern,
            ntp_key_json_replacement) | from_json)
          - result['changed'] == false
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
