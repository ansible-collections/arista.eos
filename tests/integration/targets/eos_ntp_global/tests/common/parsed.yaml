---
- ansible.builtin.debug:
    msg:
      START eos_ntp_global_interfaces parsed integration tests on connection={{ ansible_connection
      }}

- name: Provide the running configuration for parsing (config to be parsed)
  become: true
  register: result
  arista.eos.eos_ntp_global:
    running_config: "{{ lookup('file', '_parsed.cfg') }}"
    state: parsed

- ansible.builtin.assert:
    that:
      - result.changed == false
      - >-
        (result.parsed | to_json | regex_replace(ntp_key_json_pattern,
        ntp_key_json_replacement) | from_json) ==
        (replaced.before | to_json | regex_replace(ntp_key_json_pattern,
        ntp_key_json_replacement) | from_json)
